<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Draaiboek Index</title>
  <meta name="description" content="Vind direct jouw draaiboek op je mobiel">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
  
  <!-- Front-end opmaak -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>📋 Draaiboek Index</h1>
      <div class="subtitle">Vind direct jouw draaiboek</div>
    </header>

    <!-- Opgeslagen Draaiboeken (bovenaan bewaard voor snelle toegang) -->
    <div id="savedSection" class="saved-section" style="display: none;">
      <div class="section-label">
        <span>⭐ Mijn Opgeslagen Draaiboeken</span>
        <span id="savedCounter"></span>
      </div>
      <div id="savedList" class="saved-list"></div>
    </div>

    <!-- Zoekbalk -->
    <input type="search" id="searchInput" class="search-input" placeholder="🔍 Typ je naam of nummer..." autocomplete="off">

    <!-- Directe dropdown voor snelle mobiele selectie -->
    <select id="quickSelect" class="select-input">
      <option value="">▼ Of kies je naam uit de lijst...</option>
    </select>

    <!-- Lijst overzicht -->
    <div class="section-label">
      <span>Alle draaiboeken</span>
      <span id="counter">Laden...</span>
    </div>

    <div id="loadingMsg" class="status-msg">Draaiboeken laden...</div>
    <div id="draaiboekList" class="list" style="display: none;"></div>
    <div id="emptyMsg" class="status-msg" style="display: none;">Geen draaiboek gevonden</div>
  </div>

  <!-- Papa Parse voor CSV parsing in de browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Back-end: Gegevens ophalen, parsen en URLs opschonen -->
  <script src="backend.js"></script>

  <!-- Front-end: Mobiele interactie, zoeken en weergave -->
  <script src="app.js"></script>
</body>
</html>
